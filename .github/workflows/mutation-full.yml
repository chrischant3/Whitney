# Runs `check.py full` every week and on demand: every mutant from scratch
# against the current tests, plus the dependency scan (CONSTRAINTS.md). It is
# what catches a weakened test that `task`'s diff-only mutation can't, since
# `task` keeps the cached verdicts of functions the diff didn't touch.
#
# A fall in the project mutation score fails the run, and GitHub emails the
# repository's owner when a scheduled run fails. The run never edits
# CONSTRAINTS.md: a person records a new ratchet value, in its own commit.
#
# Run it by hand from the Actions tab ("Run workflow"). Only a run on main
# saves its results for checks.yml to start from.
name: Mutation (full)

on:
  schedule:
    - cron: "17 2 * * 0" # Sundays 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    name: check.py full
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Whitney with every extra
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --require-hashes -r requirements.lock
          .venv/bin/pip install --quiet --no-deps -e .

      - name: Install gitleaks and osv-scanner
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          OSV_VERSION: 2.7.1
          OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          curl -sSfL -o "$RUNNER_TEMP/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/bin/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # tests/test_junit.py validates Whitney's JUnit XML against tests/data/junit/JUnit.xsd with xmllint;
      # without it mutmut's clean test run fails and no mutant is checked (run 43581120436).
      - name: Install xmllint
        run: command -v xmllint || { sudo apt-get update -q && sudo apt-get install -y -q libxml2-utils; }

      # From scratch: no mutants/ is restored, so every verdict is measured
      # against today's tests.
      - name: check.py full
        run: .venv/bin/python scripts/check.py full 2>&1 | tee check.log; exit "${PIPESTATUS[0]}"

      - name: List every mutant's result
        if: always()
        run: .venv/bin/python -m mutmut results --all true > mutmut-results.txt 2>&1 || true

      - name: Summary
        if: always()
        run: |
          {
            echo '### check.py full'
            echo '```'
            grep -E '^\[|^checks:' check.log || echo "check.py printed no results; see the step log"
            echo '```'
            echo "Survivors: $(grep -c ': survived$' mutmut-results.txt || true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the log and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-full-${{ github.run_id }}
          path: |
            check.log
            mutmut-results.txt
            mutants/mutmut-stats.json
            mutants/src/**/*.meta
          retention-days: 90

      - name: Save the results for pull requests to start from
        if: always() && github.ref == 'refs/heads/main' && hashFiles('mutants/mutmut-stats.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          key: mutants-full-${{ github.sha }}-${{ github.run_id }}
