# After each push to main, updates every open pull request into main that has
# auto-merge on and is behind main, as pressing "Update branch" does: GitHub
# merges main into the pull request's branch (a merge, never a rebase, so
# signed commits stay as they are), and the pull request's checks run again.
# With "Require branches to be up to date before merging" on, auto-merge then
# merges them one at a time, each tested against the latest main.
#
# It needs a person's fine-grained token in the PR_UPDATE_TOKEN secret: GitHub
# starts no workflow runs for a push made with the workflow's own token, so an
# update made with it would leave the checks waiting. The token needs this
# repository only, with Contents, Pull requests and Workflows read and write
# (Workflows because main's workflow changes are merged into the branch).
#
# The secret is only read on a push to main or a run started by hand, never in
# a pull request's own run, and scripts/update_prs.py is main's copy.
name: Update pull requests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-prs
  cancel-in-progress: true # a newer main supersedes this run

jobs:
  update:
    name: Update pull requests set to auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update each one that's behind main
        env:
          GH_TOKEN: ${{ secrets.PR_UPDATE_TOKEN }}
        shell: bash # -eo pipefail, so the script's exit code isn't lost in the pipe to tee
        run: python3 -I scripts/update_prs.py --repo "$GITHUB_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
