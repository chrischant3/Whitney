[project]
name = "whitney"
version = "0.1.0"
description = "AI-Assisted Development Instruction Eval Framework"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
# Pinned to the versions the Phase 0 spikes ran on; bump deliberately and re-run the spikes.
dependencies = [
    "inspect-ai==0.3.287",
    "pydantic>=2,<3",  # scenario validation; already required by inspect-ai
]

[project.entry-points.inspect_ai]
whitney = "whitney._registry"

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    # CONSTRAINTS.md checks (scripts/check.py)
    "pytest-cov==7.1.0",
    "diff-cover==11.0.0",
    "mutmut==3.8.1",
    # Runs check.py's test-and-coverage step on every core (`-n auto`); pytest-cov combines the workers' coverage
    "pytest-xdist==3.8.0",
    # mutmut's runs only (`[tool.mutmut]` below): fails a test a looping mutant never lets finish
    "pytest-timeout==2.4.0",
]
ifevalcode = ["inspect-evals[ifevalcode]==0.27.0"]  # supplies the IFEvalCode scorer, so pinned like inspect-ai
gateway = ["openai>=1", "anthropic>=2"]  # Docker mode: Inspect's bridge serves Kilo's OpenAI- or Anthropic-format calls
harbor = ["inspect-harbor==1.0.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# End-to-end smoke tests call real models and cost money, so the default run
# (and check.py and mutmut, which run it) leaves them out. Run them on purpose
# with `pytest -m e2e tests/e2e`; see tests/e2e/test_core_scenarios.py.
addopts = ["-m", "not e2e"]
markers = ["e2e: end-to-end smoke test against a real harness and model (opt-in, costs money)"]

# Mutation testing (CONSTRAINTS.md). mutmut copies the project into mutants/,
# so anything the tests read from the repo root must be listed in also_copy.
[tool.mutmut]
source_paths = ["src/whitney/"]
pytest_add_cli_args_test_selection = ["tests/"]
# A mutant that loops forever (`i += 1` -> `i += 2` in a parser) fails its test after 30 s, not
# after mutmut's (covering tests' time + 1) x 15, which reached 217 s while the loop's list grew
# to 5-7 GB and the OOM killer took it (docs/mutation-testing-options.md). 30 s is well above the
# slowest test, about 6.5 s, so a slow machine doesn't fail a sound test.
pytest_add_cli_args = ["--timeout=30"]
also_copy = ["evals/", "template/", "docker/", "scripts/", "docs/", "requirements.lock", "CONSTRAINTS.md"]
